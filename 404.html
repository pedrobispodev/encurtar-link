<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando... | LinkSnap</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #334155;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>A redirecionar para o link original...</p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        async function redirect() {
            // Extrai o código curto do final da URL
            const pathParts = window.location.pathname.split('/');
            const shortCode = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];

            if (shortCode) {
                const { data, error } = await supabaseClient
                    .from('links')
                    .select('original_url')
                    .eq('short_code', shortCode)
                    .maybeSingle();

                if (data && data.original_url) {
                    window.location.href = data.original_url;
                    return;
                }
            }

            // Se não encontrar o link
            document.body.innerHTML = '<h1>Link não encontrado</h1><p>O link encurtado não existe ou expirou.</p><a href="/" style="color:#818cf8;">Voltar ao início</a>';
        }

        redirect();
    </script>
</body>
</html>
