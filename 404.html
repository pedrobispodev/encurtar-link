<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando... | LinkSnap</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #334155;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-box {
            max-width: 400px;
            padding: 1.5rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 0.75rem;
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>A redirecionar para o link original...</p>
    </div>

    <div id="error" style="display: none;" class="error-box">
        <h3 style="margin-top:0;">Link não encontrado</h3>
        <p id="error-msg">O link encurtado não existe ou expirou.</p>
        <a href="../" style="color:#818cf8; display:inline-block; margin-top:1rem;">Voltar ao início</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script>
        async function redirect() {
            try {
                const segments = window.location.pathname.split('/').filter(Boolean);
                const shortCode = segments[segments.length - 1];

                console.log('Código curto detetado:', shortCode);

                if (!shortCode || shortCode === 'encurtar-link' || shortCode === 's') {
                    throw new Error('Código inválido');
                }

                const { data, error } = await supabaseClient
                    .from('links')
                    .select('original_url')
                    .eq('short_code', shortCode)
                    .maybeSingle();

                if (error) {
                    console.error('Erro do Supabase:', error);
                    throw error;
                }

                if (data && data.original_url) {
                    window.location.href = data.original_url;
                } else {
                    showError('Este link curto não está registado na base de dados.');
                }
            } catch (err) {
                console.error('Erro no redirecionamento:', err);
                showError('Não foi possível carregar o link.');
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-msg').textContent = msg;
            document.getElementById('error').style.display = 'block';
        }

        redirect();
    </script>
</body>
</html>
