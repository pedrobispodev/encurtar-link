<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkSnap - Encurtador de Links</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-link"></i>
                <h1>LinkSnap</h1>
            </div>
            <p class="tagline">Encurtador de links rápido, gratuito e simples</p>
        </header>

        <main>
            <div class="card">
                <div class="input-section">
                    <div class="input-group">
                        <input
                            type="url"
                            id="urlInput"
                            placeholder="Cole seu link aqui (https://...)"
                            autocomplete="off"
                        >
                        <button id="shortenBtn" class="btn-primary">
                            <i class="fas fa-cut"></i>
                            <span>Encurtar</span>
                        </button>
                    </div>
                    <p class="hint">Funciona com qualquer URL: GitHub, GitHub Pages, sites pessoais, etc.</p>
                </div>

                <div id="resultSection" class="result-section hidden">
                    <div class="result-box">
                        <span class="label">Seu link encurtado:</span>
                        <div class="short-url-group">
                            <input type="text" id="shortUrlOutput" readonly>
                            <button id="copyBtn" class="btn-secondary">
                                <i class="fas fa-copy"></i>
                                <span>Copiar</span>
                            </button>
                        </div>
                        <a id="openShortLink" href="#" target="_blank" class="open-link">
                            <i class="fas fa-external-link-alt"></i> Abrir link
                        </a>
                    </div>
                </div>

                <div id="loadingSection" class="loading-section hidden">
                    <div class="spinner"></div>
                    <p>Gerando link curto...</p>
                </div>

                <div id="errorSection" class="error-section hidden">
                    <i class="fas fa-exclamation-circle"></i>
                    <p id="errorMessage"></p>
                </div>
            </div>

            <div class="card history-card">
                <div class="history-header">
                    <h2><i class="fas fa-history"></i> Histórico da Sessão</h2>
                    <button id="clearHistoryBtn" class="btn-text">
                        <i class="fas fa-trash"></i> Limpar
                    </button>
                </div>
                <div id="historyList" class="history-list">
                    <p class="empty-history">Nenhum link encurtado ainda.</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Feito com <i class="fas fa-heart"></i> usando Supabase + GitHub Pages</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
